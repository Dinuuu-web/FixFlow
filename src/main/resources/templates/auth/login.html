<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Login')}"></head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">🔧</div>
      <div class="auth-logo-text">
        <div class="brand">FixFlow</div>
        <div class="tagline">Smart Campus Issue Resolution</div>
      </div>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <!-- Alerts -->
    <div th:if="${errorMsg}" class="alert alert-danger mb-16">
      <span class="alert-icon">⚠️</span>
      <div class="alert-content" th:text="${errorMsg}"></div>
    </div>
    <div th:if="${logoutMsg}" class="alert alert-info mb-16">
      <span class="alert-icon">ℹ️</span>
      <div class="alert-content" th:text="${logoutMsg}"></div>
    </div>
    <div th:if="${successMsg}" class="alert alert-success mb-16">
      <span class="alert-icon">✅</span>
      <div class="alert-content" th:text="${successMsg}"></div>
    </div>

    <form th:action="@{/login}" method="post" class="auth-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="togglePassword" class="password-toggle-btn"
                  aria-label="Show password" tabindex="0">
            <!-- Eye open icon (shown when password is hidden) -->
            <svg id="eyeOpen" class="password-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye closed icon (shown when password is visible) -->
            <svg id="eyeClosed" class="password-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a th:href="@{/register}">Register as a Student</a>
    </div>

    <!-- Demo credentials -->
    <div style="margin-top:24px; padding:16px; background:rgba(255,255,255,0.04); border-radius:10px; border:1px solid rgba(255,255,255,0.08);">
      <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Demo Credentials</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:rgba(255,255,255,0.6);">
        <div>🛡️ <strong style="color:rgba(255,255,255,0.8);">Admin:</strong> admin@fixflow.com / admin123</div>
        <div>🔧 <strong style="color:rgba(255,255,255,0.8);">Staff:</strong> ravi@fixflow.com / staff123</div>
        <div>🎓 <strong style="color:rgba(255,255,255,0.8);">Student:</strong> arjun@student.fixflow.com / student123</div>
      </div>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
