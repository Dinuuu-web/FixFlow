<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Register')}"></head>
<body>

<div class="auth-page">
  <div class="auth-card" style="max-width:520px;">

    <div class="auth-logo">
      <div class="auth-logo-icon">🔧</div>
      <div class="auth-logo-text">
        <div class="brand">FixFlow</div>
        <div class="tagline">Smart Campus Issue Resolution</div>
      </div>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Register as a student to report campus issues</p>

    <div th:if="${errorMsg}" class="alert alert-danger mb-16">
      <span class="alert-icon">⚠️</span>
      <div class="alert-content" th:text="${errorMsg}"></div>
    </div>

    <form th:action="@{/register}" method="post" class="auth-form"
          th:object="${registerDto}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name <span>*</span></label>
          <input type="text" id="fullName" class="form-control"
                 th:field="*{fullName}" placeholder="Your full name" required />
          <div class="form-error" th:if="${#fields.hasErrors('fullName')}"
               th:errors="*{fullName}">Error</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="rollNumber">Roll Number</label>
          <input type="text" id="rollNumber" class="form-control"
                 th:field="*{rollNumber}" placeholder="e.g. CSE2021001" />
          <div class="form-error" th:if="${#fields.hasErrors('rollNumber')}"
               th:errors="*{rollNumber}">Error</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address <span>*</span></label>
        <input type="email" id="email" class="form-control"
               th:field="*{email}" placeholder="you@example.com" required />
        <div class="form-error" th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">Error</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-control"
               th:field="*{phone}" placeholder="+91 9876543210" />
        <div class="form-error" th:if="${#fields.hasErrors('phone')}"
             th:errors="*{phone}">Error</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="departmentId">Department</label>
        <select id="departmentId" class="form-control" th:field="*{departmentId}">
          <option value="">Select department</option>
          <option th:each="dept : ${departments}" th:value="${dept.id}"
                  th:text="${dept.name}">Department</option>
        </select>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="password">Password <span>*</span></label>
          <input type="password" id="password" class="form-control"
                 th:field="*{password}" placeholder="Min 8 characters" required />
          <div class="form-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">Error</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password <span>*</span></label>
          <input type="password" id="confirmPassword" class="form-control"
                 th:field="*{confirmPassword}" placeholder="Repeat password" required />
          <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}">Error</div>
        </div>
      </div>

      <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
