<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Complaint Details')}"></head>
<body>
<div class="layout">
  <th:block th:replace="~{fragments/layout :: sidebar('complaints')}"></th:block>
  <div class="main-content">
    <th:block th:replace="~{fragments/layout :: topbar('Complaint Details', ${complaint.complaintId})}"></th:block>

    <div class="page-content">
      <div th:if="${successMsg}" th:data-toast-success="${successMsg}" style="display:none"></div>
      <div th:if="${errorMsg}"   th:data-toast-error="${errorMsg}"   style="display:none"></div>

      <!-- Back -->
      <div style="margin-bottom:16px;">
        <a th:href="@{/student/complaints}" class="btn btn-secondary btn-sm">← Back to My Complaints</a>
      </div>

      <!-- Complaint Header -->
      <div class="complaint-header">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
            <span class="complaint-id" th:text="${complaint.complaintId}">FF-1001</span>
            <span th:replace="~{fragments/layout :: statusBadge(${complaint.status})}"></span>
            <span th:replace="~{fragments/layout :: priorityBadge(${complaint.priority})}"></span>
            <span th:if="${complaint.overdue}" class="overdue-badge">⚠ OVERDUE</span>
          </div>
          <h1 style="font-size:20px;font-weight:700;color:var(--text);line-height:1.3;"
              th:text="${complaint.title}">Title</h1>

          <div class="complaint-meta">
            <div class="meta-item">
              <div class="meta-label">Category</div>
              <div class="meta-value" th:text="${complaint.category}">Cat</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Location</div>
              <div class="meta-value">📍 <span th:text="${complaint.location}">Loc</span></div>
            </div>
            <div class="meta-item" th:if="${complaint.department}">
              <div class="meta-label">Department</div>
              <div class="meta-value" th:text="${complaint.department.name}">Dept</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Submitted</div>
              <div class="meta-value" th:text="${#temporals.format(complaint.createdAt, 'dd MMM yyyy, HH:mm')}">Date</div>
            </div>
            <div class="meta-item" th:if="${complaint.assignedTo}">
              <div class="meta-label">Assigned To</div>
              <div class="meta-value" th:text="${complaint.assignedTo.fullName}">Staff</div>
            </div>
            <div class="meta-item" th:if="${complaint.resolvedAt}">
              <div class="meta-label">Resolved At</div>
              <div class="meta-value" th:text="${#temporals.format(complaint.resolvedAt, 'dd MMM yyyy, HH:mm')}">Date</div>
            </div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;" class="detail-grid">
        <!-- Left Column -->
        <div>
          <!-- Description -->
          <div class="card mb-24">
            <div class="card-header"><div class="card-title">📄 Description</div></div>
            <div class="card-body">
              <div class="complaint-description" th:text="${complaint.description}">Description</div>
            </div>
          </div>

          <!-- Image -->
          <div th:if="${complaint.imagePath}" class="card mb-24">
            <div class="card-header"><div class="card-title">📷 Attached Photo</div></div>
            <div class="card-body" style="text-align:center;">
              <img th:src="${complaint.imagePath}" alt="Complaint photo"
                   style="max-width:100%;max-height:400px;border-radius:8px;" />
            </div>
          </div>

          <!-- Admin Remarks -->
          <div th:if="${complaint.adminRemarks}" class="card mb-24">
            <div class="card-header"><div class="card-title">💬 Admin Remarks</div></div>
            <div class="card-body">
              <div class="complaint-description" th:text="${complaint.adminRemarks}">Remarks</div>
            </div>
          </div>
        </div>

        <!-- Right Column: Timeline -->
        <div>
          <div class="card">
            <div class="card-header"><div class="card-title">📅 Status Timeline</div></div>
            <div class="card-body">
              <div th:if="${#lists.isEmpty(history)}" class="text-muted text-sm">No history recorded.</div>
              <div class="timeline">
                <div th:each="h : ${history}" class="timeline-item">
                  <div class="timeline-dot"></div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <span class="timeline-actor"
                            th:text="${h.changedBy != null ? h.changedBy.fullName : 'System'}">Actor</span>
                      <span class="timeline-time"
                            th:text="${#temporals.format(h.changedAt, 'dd MMM, HH:mm')}">Time</span>
                    </div>
                    <div class="timeline-status">
                      <span th:if="${h.fromStatus}"
                            class="badge badge-dot"
                            th:classappend="'badge-' + ${#strings.toLowerCase(h.fromStatus.toString())}"
                            th:text="${h.fromStatus}">From</span>
                      <span th:if="${h.fromStatus}" class="timeline-arrow">→</span>
                      <span class="badge badge-dot"
                            th:classappend="'badge-' + ${#strings.toLowerCase(h.toStatus.toString())}"
                            th:text="${h.toStatus}">To</span>
                    </div>
                    <div th:if="${h.remarks}" class="timeline-remark" th:text="${h.remarks}">Remarks</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Cancel Button -->
          <div th:if="${complaint.status.name() == 'PENDING'}" style="margin-top:16px;">
            <form th:action="@{/student/complaint/{id}/cancel(id=${complaint.complaintId})}"
                  method="post" id="cancelForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="button" class="btn btn-danger w-full"
                      onclick="confirmAction('Are you sure you want to cancel this complaint?', 'cancelForm')">
                🗑 Cancel Complaint
              </button>
            </form>
          </div>
        </div>
      </div>

    </div><!-- /page-content -->
  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<style>
  @media(max-width:900px){ .detail-grid { grid-template-columns: 1fr !important; } }
</style>
</body>
</html>
