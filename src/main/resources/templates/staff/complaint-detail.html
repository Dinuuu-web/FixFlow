<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Complaint Details')}"></head>
<body>
<div class="layout">
  <th:block th:replace="~{fragments/layout :: sidebar('dashboard')}"></th:block>
  <div class="main-content">
    <th:block th:replace="~{fragments/layout :: topbar('Complaint Details', ${complaint.complaintId})}"></th:block>

    <div class="page-content">
      <div th:if="${successMsg}" th:data-toast-success="${successMsg}" style="display:none"></div>
      <div th:if="${errorMsg}"   th:data-toast-error="${errorMsg}"   style="display:none"></div>

      <div style="margin-bottom:16px;">
        <a th:href="@{/staff/dashboard}" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
      </div>

      <!-- Header -->
      <div class="complaint-header">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
            <span class="complaint-id" th:text="${complaint.complaintId}">FF-1001</span>
            <span th:replace="~{fragments/layout :: statusBadge(${complaint.status})}"></span>
            <span th:replace="~{fragments/layout :: priorityBadge(${complaint.priority})}"></span>
            <span th:if="${complaint.overdue}" class="overdue-badge">⚠ OVERDUE</span>
          </div>
          <h1 style="font-size:20px;font-weight:700;" th:text="${complaint.title}">Title</h1>
          <div class="complaint-meta">
            <div class="meta-item">
              <div class="meta-label">Category</div>
              <div class="meta-value" th:text="${complaint.category}">Cat</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Location</div>
              <div class="meta-value">📍 <span th:text="${complaint.location}">Loc</span></div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Submitted</div>
              <div class="meta-value" th:text="${#temporals.format(complaint.createdAt, 'dd MMM yyyy, HH:mm')}">Date</div>
            </div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;" class="staff-detail-grid">
        <!-- Left -->
        <div>
          <div class="card mb-24">
            <div class="card-header"><div class="card-title">📄 Description</div></div>
            <div class="card-body">
              <div class="complaint-description" th:text="${complaint.description}">Desc</div>
            </div>
          </div>

          <div th:if="${complaint.imagePath}" class="card mb-24">
            <div class="card-header"><div class="card-title">📷 Attached Photo</div></div>
            <div class="card-body" style="text-align:center;">
              <img th:src="${complaint.imagePath}" alt="Complaint photo"
                   style="max-width:100%;max-height:400px;border-radius:8px;" />
            </div>
          </div>

          <!-- Timeline -->
          <div class="card">
            <div class="card-header"><div class="card-title">📅 Status Timeline</div></div>
            <div class="card-body">
              <div class="timeline">
                <div th:each="h : ${history}" class="timeline-item">
                  <div class="timeline-dot"></div>
                  <div class="timeline-content">
                    <div class="timeline-header">
                      <span class="timeline-actor"
                            th:text="${h.changedBy != null ? h.changedBy.fullName : 'System'}">Actor</span>
                      <span class="timeline-time"
                            th:text="${#temporals.format(h.changedAt, 'dd MMM, HH:mm')}">Time</span>
                    </div>
                    <div class="timeline-status">
                      <span th:if="${h.fromStatus}" class="badge badge-dot"
                            th:classappend="'badge-' + ${#strings.toLowerCase(h.fromStatus.toString())}"
                            th:text="${h.fromStatus}">From</span>
                      <span th:if="${h.fromStatus}" class="timeline-arrow">→</span>
                      <span class="badge badge-dot"
                            th:classappend="'badge-' + ${#strings.toLowerCase(h.toStatus.toString())}"
                            th:text="${h.toStatus}">To</span>
                    </div>
                    <div th:if="${h.remarks}" class="timeline-remark" th:text="${h.remarks}">Remarks</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Staff Actions -->
        <div>
          <div class="card">
            <div class="card-header"><div class="card-title">🔄 Update Status</div></div>
            <div class="card-body">
              <form th:action="@{/staff/complaint/{id}/update(id=${complaint.complaintId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                  <label class="form-label">New Status</label>
                  <select name="status" class="form-control" required>
                    <option value="">Select new status</option>
                    <option value="IN_PROGRESS"
                            th:selected="${complaint.status.name() == 'IN_PROGRESS'}">
                      🔧 In Progress
                    </option>
                    <option value="RESOLVED"
                            th:selected="${complaint.status.name() == 'RESOLVED'}">
                      ✅ Resolved
                    </option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Work Notes / Remarks</label>
                  <textarea name="remarks" class="form-control" rows="4"
                            placeholder="Describe the work done or current status..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-full"
                        th:disabled="${complaint.status.name() == 'RESOLVED'}">
                  Update Status
                </button>
                <div th:if="${complaint.status.name() == 'RESOLVED'}"
                     class="form-hint text-center" style="margin-top:8px;">
                  This complaint is already resolved.
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<style>
  @media(max-width:900px){ .staff-detail-grid { grid-template-columns: 1fr !important; } }
</style>
</body>
</html>
