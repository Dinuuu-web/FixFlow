<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Departments')}"></head>
<body>
<div class="layout">
  <th:block th:replace="~{fragments/layout :: sidebar('departments')}"></th:block>
  <div class="main-content">
    <th:block th:replace="~{fragments/layout :: topbar('Departments', 'Manage campus departments')}"></th:block>

    <div class="page-content">
      <div th:if="${successMsg}" th:data-toast-success="${successMsg}" style="display:none"></div>
      <div th:if="${errorMsg}"   th:data-toast-error="${errorMsg}"   style="display:none"></div>

      <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;" class="dept-grid">
        <!-- List -->
        <div class="card">
          <div class="card-header"><div class="card-title">🏢 All Departments</div></div>
          <div class="table-wrapper">
            <table class="table">
              <thead><tr><th>#</th><th>Name</th><th>Description</th><th>Status</th></tr></thead>
              <tbody>
                <tr th:each="dept, stat : ${departments}">
                  <td th:text="${stat.count}" style="color:var(--text-muted);">1</td>
                  <td style="font-weight:600;" th:text="${dept.name}">Dept</td>
                  <td style="font-size:12px;color:var(--text-muted);" th:text="${dept.description}">Desc</td>
                  <td>
                    <span th:if="${dept.active}" class="badge" style="background:#d1fae5;color:#065f46;">Active</span>
                    <span th:unless="${dept.active}" class="badge" style="background:#f1f5f9;color:#64748b;">Inactive</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add Form -->
        <div class="card" style="align-self:start;">
          <div class="card-header"><div class="card-title">➕ Add Department</div></div>
          <div class="card-body">
            <form th:action="@{/admin/departments}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="form-group">
                <label class="form-label" for="name">Name <span>*</span></label>
                <input type="text" id="name" name="name" class="form-control"
                       placeholder="e.g. Computer Science" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3"
                          placeholder="Brief description"></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-full">Add Department</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<style>@media(max-width:900px){ .dept-grid { grid-template-columns: 1fr !important; } }</style>
</body>
</html>
