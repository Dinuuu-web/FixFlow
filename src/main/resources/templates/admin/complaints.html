<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='All Complaints')}"></head>
<body>
<div class="layout">
  <th:block th:replace="~{fragments/layout :: sidebar('complaints')}"></th:block>
  <div class="main-content">
    <th:block th:replace="~{fragments/layout :: topbar('All Complaints', 'Manage and triage campus complaints')}"></th:block>

    <div class="page-content">
      <div th:if="${successMsg}" th:data-toast-success="${successMsg}" style="display:none"></div>
      <div th:if="${errorMsg}"   th:data-toast-error="${errorMsg}"   style="display:none"></div>

      <div class="card">
        <!-- Filters -->
        <div class="filters-bar">
          <span style="font-size:13px;font-weight:600;color:var(--text-muted);">Filter:</span>

          <select class="filter-select" data-filter-select="status">
            <option value="">All Statuses</option>
            <option th:each="s : ${ {'PENDING','ASSIGNED','IN_PROGRESS','RESOLVED','REJECTED','CANCELLED'} }"
                    th:value="${s}" th:text="${s}"
                    th:selected="${selectedStatus == s}">Status</option>
          </select>

          <select class="filter-select" data-filter-select="priority">
            <option value="">All Priorities</option>
            <option th:each="p : ${ {'CRITICAL','HIGH','MEDIUM','LOW'} }"
                    th:value="${p}" th:text="${p}"
                    th:selected="${selectedPriority == p}">Priority</option>
          </select>

          <select class="filter-select" data-filter-select="category">
            <option value="">All Categories</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat}" th:text="${cat}"
                    th:selected="${selectedCategory == cat}">Cat</option>
          </select>

          <a th:href="@{/admin/complaints}" class="btn btn-secondary btn-sm">Clear Filters</a>

          <span style="margin-left:auto;font-size:12px;color:var(--text-muted);"
                th:text="${complaints.size()} + ' complaint(s) shown'"></span>
        </div>

        <!-- Table -->
        <div th:if="${#lists.isEmpty(complaints)}" class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">No complaints found</div>
          <div class="empty-sub">Try adjusting your filters.</div>
        </div>

        <div th:unless="${#lists.isEmpty(complaints)}" class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th><th>Title / Location</th><th>Category</th><th>Priority</th>
                <th>Status</th><th>Reporter</th><th>Assigned</th><th>Date</th><th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${complaints}" th:classappend="${c.overdue} ? 'overdue-row'">
                <td>
                  <span class="complaint-id" th:text="${c.complaintId}">FF-1001</span>
                  <span th:if="${c.overdue}" class="overdue-badge" style="display:flex;margin-top:3px;">⚠ OD</span>
                </td>
                <td class="title-cell" style="max-width:240px;">
                  <div class="title truncate" th:text="${c.title}">Title</div>
                  <div class="location">📍 <span th:text="${c.location}">Location</span></div>
                </td>
                <td style="font-size:12px;" th:text="${c.category}">Cat</td>
                <td><span th:replace="~{fragments/layout :: priorityBadge(${c.priority})}"></span></td>
                <td><span th:replace="~{fragments/layout :: statusBadge(${c.status})}"></span></td>
                <td style="font-size:12px;" th:text="${c.reportedBy.fullName}">Student</td>
                <td style="font-size:12px;">
                  <span th:if="${c.assignedTo}" th:text="${c.assignedTo.fullName}">Staff</span>
                  <span th:unless="${c.assignedTo}" class="text-muted">—</span>
                </td>
                <td style="font-size:12px;white-space:nowrap;"
                    th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}">Date</td>
                <td>
                  <a th:href="@{/admin/complaint/{id}(id=${c.complaintId})}"
                     class="btn btn-sm btn-primary">Manage</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
